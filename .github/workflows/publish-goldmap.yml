name: Publish goldmap

# Publishes goldmap to PyPI as `goldmap`, when a tag `vX.Y.Z` is pushed (CONTRIBUTING.md, "A release"). goldmap is plain Python, so the
# upload is one wheel and a source archive. No token is stored anywhere: PyPI trusts this workflow (a "trusted publisher"), and the upload
# job waits for the maintainer's approval of the `pypi` environment.
#
# Run by hand (Actions, "Run workflow") it only builds the package and tests the wheel and never publishes: a dry run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag, the version numbers and the changelog agree, and the tag is on main (tag pushes only)
        if: github.ref_type == 'tag'
        run: |
          python tools/check_release.py "$GITHUB_REF_NAME"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag is not on main. Tag the merge commit of the release pull request (CONTRIBUTING.md)."
            exit 1
          fi

      - name: Build the wheel and the source archive
        run: |
          python -m pip install build
          python -m build --outdir dist

      - name: Install the wheel in a clean environment (goldpan and goldsluice come from PyPI) and start it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"                                                  # away from the source folder of the package
          "$RUNNER_TEMP/venv/bin/python" -c "import goldmap; print('goldmap', goldmap.__version__, goldmap.__file__)"
          "$RUNNER_TEMP/venv/bin/goldmap" --help
          "$RUNNER_TEMP/venv/bin/python" -c "import importlib.resources as r; assert r.files('goldmap').joinpath('static').is_dir(), 'the page (static/) is missing from the wheel'"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/goldmap/
    permissions:
      id-token: write # the trusted publisher: PyPI accepts this workflow's identity instead of a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
