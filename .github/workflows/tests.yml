name: tests

# Runs the tests of goldmap on Linux, Windows and macOS. goldmap sits on top of goldpan and goldsluice, which live in NSDF-Data (goldsluice is
# not on PyPI: it is a Rust extension), so the job checks out NSDF-Data (its `develop` branch), installs goldpan from there, builds the
# goldsluice wheel with maturin (Rust is already on the runners) and installs both before it tests goldmap. The tests read the registry
# folder of that checkout. A weekly run tells when a change in NSDF-Data `develop` breaks goldmap.

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out goldpan and goldsluice (NSDF-Data, develop)
        uses: actions/checkout@v4
        with:
          repository: villano-lab/NSDF-Data
          ref: develop
          path: nsdf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install goldpan and build goldsluice
        run: |
          python -m pip install maturin pytest numpy
          python -m pip install -e "nsdf/python[parquet]"
          maturin build --manifest-path nsdf/goldsluice/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist goldsluice

      - name: Install goldmap
        run: python -m pip install --no-deps -e .

      - name: Tests
        run: python -m pytest -q
