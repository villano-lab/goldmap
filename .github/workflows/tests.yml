name: tests

# Runs the tests of goldmap on Linux, Windows and macOS. goldmap sits on top of goldpan and goldsluice (both on PyPI), so the job installs the
# released packages that goldmap asks for (pyproject.toml). The tests also need the detector registry, which is data in NSDF-Data and not part
# of the package, so the job checks out NSDF-Data (`main`, the released code) for that folder only. A weekly run tells when a new release of
# goldpan or goldsluice breaks goldmap.

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the detector registry (NSDF-Data, main)
        uses: actions/checkout@v4
        with:
          repository: villano-lab/NSDF-Data
          ref: main
          path: nsdf
          sparse-checkout: registry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install goldmap with the goldpan and goldsluice it asks for, from PyPI
        run: |
          python -m pip install pytest
          python -m pip install -e .
          python -m pip list

      - name: Tests
        env:
          GOLDMAP_TEST_REGISTRY: ${{ github.workspace }}/nsdf/registry
        run: python -m pytest -q -rs
